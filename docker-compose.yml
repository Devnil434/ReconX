services:
  postgres:
    image: postgres:17
    container_name: reconx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reconx
      POSTGRES_PASSWORD: reconx_dev_password
      POSTGRES_DB: reconx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx -d reconx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reconx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://reconx:reconx_dev_password@postgres:5432/reconx
      REDIS_URL: redis://redis:6379/0
      RAZORPAY_WEBHOOK_SECRET: 22WNn-ET.Xaqncn
      RAZORPAY_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://reconx:reconx_dev_password@postgres:5432/reconx
      REDIS_URL: redis://redis:6379/0
      RAZORPAY_WEBHOOK_SECRET: 22WNn-ET.Xaqncn
      RAZORPAY_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: