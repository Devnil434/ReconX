services:
  postgres:
    image: postgres:17
    container_name: reconx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reconx
      POSTGRES_PASSWORD: reconx_dev_password
      POSTGRES_DB: reconx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx -d reconx"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reconx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: